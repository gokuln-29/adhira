# /etc/nginx/snippets/adhira-proxy.conf
# Overwrite (not append to) forwarding headers: the app trusts X-Real-IP /
# X-Forwarded-For for rate limiting, so a client must never be able to inject them.
proxy_pass http://adhira_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
