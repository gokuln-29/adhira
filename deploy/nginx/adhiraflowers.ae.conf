# /etc/nginx/sites-available/adhiraflowers.ae.conf  (symlink into sites-enabled)
# Canonical host: https://adhiraflowers.ae  (www and plain HTTP redirect to it).
# Certificates come from certbot; run it once HTTP is serving:
#   sudo certbot certonly --webroot -w /var/www/certbot -d adhiraflowers.ae -d www.adhiraflowers.ae
# and verify renewal:  sudo certbot renew --dry-run
# If Cloudflare proxies the domain, set Cloudflare SSL mode to "Full (strict)".

# One shared zone per abuse-prone surface (per client IP).
limit_req_zone $binary_remote_addr zone=adhira_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=adhira_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=adhira_conn:10m;

upstream adhira_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---- HTTP: ACME challenge, everything else -> canonical HTTPS --------------
server {
    listen 80;
    listen [::]:80;
    server_name adhiraflowers.ae www.adhiraflowers.ae;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://adhiraflowers.ae$request_uri; }
}

# ---- www -> apex -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.adhiraflowers.ae;

    ssl_certificate     /etc/letsencrypt/live/adhiraflowers.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhiraflowers.ae/privkey.pem;
    return 301 https://adhiraflowers.ae$request_uri;
}

# ---- the site --------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adhiraflowers.ae;

    ssl_certificate     /etc/letsencrypt/live/adhiraflowers.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhiraflowers.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    server_tokens off;

    # Security headers. The app also sets a CSP + HSTS (next.config.ts); Nginx
    # repeats the transport-level ones so static/error responses carry them too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request limits. Admin images go straight to R2 (presigned PUT), so the app
    # itself never needs a big body; server actions carry JSON/forms only.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn adhira_conn 40;
    limit_req zone=adhira_general burst=60 nodelay;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Sign-in surfaces get a much tighter ceiling than the app's own limiter.
    location = /admin/login {
        limit_req zone=adhira_auth burst=10 nodelay;
        include /etc/nginx/snippets/adhira-proxy.conf;
    }
    location ~ ^/(en|ar)/account/sign-in$ {
        limit_req zone=adhira_auth burst=10 nodelay;
        include /etc/nginx/snippets/adhira-proxy.conf;
    }

    # Stripe posts here; the body must reach the app untouched (signature check).
    location = /api/stripe/webhook {
        client_max_body_size 1m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/adhira-proxy.conf;
    }

    # Immutable hashed build assets.
    location /_next/static/ {
        include /etc/nginx/snippets/adhira-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health is for localhost monitors only.
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/adhira-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/adhira-proxy.conf;
    }
}
